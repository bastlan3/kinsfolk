name: Daily reminder

on:
  schedule:
    # Runs hourly; the script exits early unless Paris clock == deadline hour.
    # Hourly cadence makes DST a non-issue.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: kinsfolk-mutate-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Send reminders if deadline hour
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run reminder

      - name: Commit reminder state
        run: |
          git config user.name "kinsfolk-bot"
          git config user.email "kinsfolk-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(reminder): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
