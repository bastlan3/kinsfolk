name: Verify monthly journal sent

on:
  schedule:
    # Once a day at 10:00 UTC (11:00 or 12:00 Paris depending on DST).
    # Script self-gates: skips before day 2, dedups via monthly_alerts.
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: kinsfolk-mutate-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Alert if last month's journal never sent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run verify-journal

      - name: Commit alert state
        run: |
          git config user.name "kinsfolk-bot"
          git config user.email "kinsfolk-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(verify): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
