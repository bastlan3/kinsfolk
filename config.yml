# Kinsfolk configuration — the only file you need to edit.
#
# After editing, also set two GitHub Actions secrets on the repo:
#   TELEGRAM_BOT_TOKEN   from @BotFather on Telegram
#   RESEND_API_KEY       from https://resend.com/api-keys

timezone: Europe/Paris

# Daily cutoff for "today's photo" (local time). A photo that arrives after
# this hour is still accepted, but the miss check at the next morning will
# treat the day as missed if nothing landed before this hour.
daily_deadline_hour: 20

# People allowed to submit. Get a Telegram ID by messaging @userinfobot.
# The bot will ignore messages from anyone not in this list.
contributors:
  - name: "CHANGE_ME"
    telegram_id: 0
  # - name: "Alice"
  #   telegram_id: 123456789

# Family members who receive the monthly journal email.
receivers:
  - "CHANGE_ME@example.com"
  # - "grandma@example.com"

journal:
  # "From" header for the monthly email.
  # Use onboarding@resend.dev until you verify your own sender domain.
  from_name: "Kinsfolk"
  from_email: "onboarding@resend.dev"
  # Reply-To lets receivers reply to a real person.
  reply_to: ""
  subject_template: "Kinsfolk — {month_name} {year}"
